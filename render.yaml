# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploys the marketing site in website/ as a static site.
# The rest of the repo (Cosmos source) is not built by this blueprint.
services:
  - type: web
    name: cosmos-website
    runtime: static
    rootDir: website
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    routes:
      # Single-page app: serve index.html for any unmatched path
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Vite fingerprints asset filenames, so they can be cached indefinitely
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
